[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "molfeat"
description = "molfeat - the hub for all your molecular featurizers"
dynamic = ["version"]
authors = [{ name = "Emmanuel Noutahi", email = "emmanuel.noutahi@hotmail.ca" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "tqdm>=4.66",
    "loguru>=0.7",
    "joblib>=1.3",
    "filelock>=3.13",
    "fsspec[http]>=2024.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.5",
    "datamol>=0.12.5",
    "pyyaml>=6",
    "platformdirs>=4",
    "pydantic>=2.7",
    "scikit-learn>=1.6",
    "packaging>=23.2",
    "pmapper>=1.1",
    "rdkit>=2024.9.1",
]

[project.optional-dependencies]
dgl = [
    "dgl>=1.1.3,<2; python_version < '3.12'",
    "dgllife>=0.3.2; python_version < '3.12'",
]

transformer = ["transformers>=4.57,<6", "sentencepiece>=0.2"]

fcd = ["fcd_torch>=1.0.7"]

viz = ["matplotlib>=3.8", "nglview>=3.1", "ipywidgets>=8.1"]

cache = ["h5py>=3.10", "pyarrow>=15"]

cloud = ["s3fs>=2024.3", "gcsfs>=2024.3"]

mordred = ["mordredcommunity>=2.0.7"]

pyg = ["torch_geometric>=2.6"]

all = [
    "dgl>=1.1.3,<2; python_version < '3.12'",
    "dgllife>=0.3.2; python_version < '3.12'",
    "transformers>=4.57,<6",
    "sentencepiece>=0.2",
    "fcd_torch>=1.0.7",
    "h5py>=3.10",
    "pyarrow>=15",
    "s3fs>=2024.3",
    "gcsfs>=2024.3",
    "mordredcommunity>=2.0.7",
    "matplotlib>=3.8",
    "nglview>=3.1",
    "ipywidgets>=8.1",
    "torch_geometric>=2.6",
]

test = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "h5py>=3.10",
    "pyarrow>=15",
    "mordredcommunity>=2.0.7",
    "matplotlib>=3.8",
]
docs = [
    "markdown-include>=0.8.1",
    "mdx-truly-sane-lists>=1.3",
    "mike>=2",
    "mkdocs>=1.6",
    "mkdocs-jupyter>=0.25",
    "mkdocs-material>=9.5",
    "mkdocs-material-extensions>=1.3",
    "mkdocstrings[python]>=0.30",
]
dev = [
    "black[jupyter]>=25",
    "build>=1.2",
    "pre-commit>=4",
    "ruff>=0.11",
    "twine>=6",
]

[project.urls]
Website = "https://molfeat.datamol.io"
"Source Code" = "https://github.com/datamol-io/molfeat"
"Bug Tracker" = "https://github.com/datamol-io/molfeat/issues"
Documentation = "https://molfeat-docs.datamol.io/"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["molfeat", "molfeat.*"]
exclude = []
namespaces = true

[tool.setuptools.package-data]
"molfeat.data" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.py[cod]"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501", # Never enforce `E501` (line length violations).
    "E731", # Do not assign a lambda expression, use a def
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # imported but unused
    "E402", # Module level import not at top of file
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 150

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--verbose --cov=molfeat --cov-report xml --cov-report term --color yes --durations=10"
testpaths = ["tests"]
norecursedirs = "tests/helpers"

[tool.coverage.run]
omit = ["setup.py", "tests/*"]

[tool.coverage.xml]
output = "cov.xml"
