name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 4 * * MON"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / RDKit ${{ matrix.rdkit-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            rdkit-version: "2024.9.*"
          - os: ubuntu-latest
            python-version: "3.12"
            rdkit-version: "2025.3.*"
          - os: ubuntu-latest
            python-version: "3.13"
            rdkit-version: "2025.9.*"
          - os: ubuntu-latest
            python-version: "3.14"
            rdkit-version: "2026.3.*"
          - os: macos-latest
            python-version: "3.13"
            rdkit-version: "2026.3.*"
          - os: windows-latest
            python-version: "3.13"
            rdkit-version: "2026.3.*"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rdkit==${{ matrix.rdkit-version }}"
          python -m pip install --editable ".[test]"

      - name: Run core tests
        run: python -m pytest --ignore=tests/test_pretrained.py --ignore=tests/test_prot_embed.py

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: cov.xml
          fail_ci_if_error: false
          flags: core

  integrations:
    name: Transformers, ESM and PyG
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install integration dependencies
        run: python -m pip install --upgrade --editable ".[test,transformer,pyg]"

      - name: Run integration tests
        run: >-
          python -m pytest
          tests/test_pretrained.py
          tests/test_prot_embed.py
          tests/test_graphs.py
          tests/test_state.py
          --no-cov -n 0

  dgl:
    name: DGL compatibility / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install DGL dependencies
        run: python -m pip install --upgrade --editable ".[test,dgl]"

      - name: Run DGL tests
        run: >-
          python -m pytest
          tests/test_atom_bond_calculator.py
          tests/test_graphs.py
          tests/test_pretrained.py::TestDGLTransformer
          --no-cov -n 0
